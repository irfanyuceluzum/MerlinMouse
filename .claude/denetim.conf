# .claude/denetim.conf — Merlin Mouse
# Bu projede test hedefi yok; denetim derlemedir. Uyarılar da bulgu sayılır.

[swift]
desen = Sources/* Package.swift
hizli = swift build
tam   = swift build -c release

[paket]
desen = build.sh Resources/*
tam   = bash -n build.sh && plutil -lint Resources/Info.plist
